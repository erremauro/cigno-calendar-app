<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="robots" content="noindex, nofollow" />
		<!-- Aggiunta alla schermata Home (iPhone e Android) -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Calendario" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#141414" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet" />
		<script>
			// Tema come su cignozen.it: chiaro dalle 7 alle 18, scuro altrimenti; la scelta manuale vale fino a mezzanotte.
			// Stessa logica di src/lib/theme.ts, ripetuta qui per applicarla prima che la pagina compaia.
			(function () {
				var theme = null;
				try {
					var o = JSON.parse(localStorage.getItem('cz-theme-override') || 'null');
					if (o && o.exp >= Date.now() && (o.theme === 'light' || o.theme === 'dark')) theme = o.theme;
				} catch (e) {}
				if (!theme) {
					var h = new Date().getHours();
					theme = h >= 7 && h < 18 ? 'light' : 'dark';
				}
				document.documentElement.dataset.theme = theme;
				var m = document.querySelector('meta[name="theme-color"]');
				if (m) m.setAttribute('content', theme === 'dark' ? '#141414' : '#fafafa');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
